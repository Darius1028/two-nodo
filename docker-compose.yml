services:
  nginx:
    image: nginx:alpine
    container_name: academic_nginx
    ports:
      # 8090 en el host, no 80 -- ese puerto ya lo usa el Apache de XAMPP
      # (para WordPress) en esta máquina. El 80 de ADENTRO del contenedor
      # no cambia, solo el mapeo hacia el host.
      - "8090:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php-app
    restart: unless-stopped
    networks:
      - app-network

  php-app:
    image: academic-php:8.2-dev

    build:
      context: .
      dockerfile: docker/Dockerfile

    container_name: academic_php

    volumes:
      # El código se actualiza sin reconstruir la imagen.
      - .:/var/www/html

      # Conserva vendor dentro de Docker.
      - vendor_data:/var/www/html/vendor

      # Datos temporales de Symfony/aplicación.
      - var_data:/var/www/html/var

    env_file:
      - .env

    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "auth.local:host-gateway"

    restart: unless-stopped

    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  vendor_data:
  var_data: