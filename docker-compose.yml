services:
  nginx:
    image: nginx:alpine
    container_name: academic_nginx
    ports:
      - "8090:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php-app
    restart: unless-stopped
    networks:
      - app-network

  php-app:
    image: academic-php:8.2-dev
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: academic_php
    volumes:
      # Código fuente
      - .:/var/www/html

      # Vendor (este SÍ puede ser volumen de Docker, no se pierde)
      - vendor_data:/var/www/html/vendor

      # ✅ CAMBIO IMPORTANTE: Bind mount local para var (logs y cache)
      # Así historial.json queda en tu disco C: y nunca se borrará.
      - ./var:/var/www/html/var

    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "auth.local:host-gateway"
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  vendor_data:
  #  ELIMINADO: var_data (ya no lo necesitamos)