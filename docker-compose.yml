services:
  nginx:
    image: nginx:alpine
    container_name: academic_nginx
    ports:
      - "8010:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php-app
    restart: unless-stopped
    networks:
      - app-network

  php-app:
    image: academic-php:8.2-dev
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: academic_php
    command: >-
      sh -c "mkdir -p /var/www/html/var/cache/assets /var/www/html/var/log /var/www/html/var/import-uploads /var/www/html/var/import-work /var/www/html/var/object-storage &&
      chown -R www-data:www-data /var/www/html/var && 
      chmod -R ug+rwX /var/www/html/var && 
      chown -R www-data:www-data /var/www/html/config && 
      chmod -R ug+rwX /var/www/html/config && 
      exec php-fpm"
    volumes:
      # Código fuente
      - .:/var/www/html
      # Vendor (este SÍ puede ser volumen de Docker, no se pierde)
      - vendor_data:/var/www/html/vendor
      # Bind mount local para var (logs y cache)
      - ./var:/var/www/html/var
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "auth.local:host-gateway"
    restart: unless-stopped
    networks:
      - app-network

  import-worker:
    image: academic-php:8.2-dev
    container_name: academic_import_worker
    # NOTA: Se eliminó el bloque 'build' para evitar que Docker intente
    # construir y etiquetar la misma imagen dos veces en paralelo.
    command: >-
      sh -c "mkdir -p /var/www/html/var/cache/assets /var/www/html/var/log /var/www/html/var/import-uploads /var/www/html/var/import-work /var/www/html/var/object-storage &&
      chown -R www-data:www-data /var/www/html/var &&
      chmod -R ug+rwX /var/www/html/var &&
      exec php bin/import-worker.php"
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
      - ./var:/var/www/html/var
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "auth.local:host-gateway"
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      - php-app

  # Infraestructura exclusivamente local. En producción ambos nodos usan el
  # clúster MinIO distribuido y SQL Server compartido.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: academic_minio
    profiles: ["local-infra"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Defina MINIO_ACCESS_KEY en .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Defina MINIO_SECRET_KEY en .env}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      - app-network

  storage-init:
    image: academic-php:8.2-dev
    profiles: ["local-infra"]
    command: php bin/storage-init.php
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
    env_file:
      - .env
    environment:
      STORAGE_DRIVER: s3
      MINIO_ENDPOINT: http://minio:9000
      MINIO_TLS_VERIFY: "false"
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  vendor_data:
  minio_data:
