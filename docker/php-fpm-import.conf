; ---------------------------------------------------------------------------
; Ajustes del pool de PHP-FPM para la importación masiva de CSV.
;
; PHP-FPM mata los requests por su cuenta con request_terminate_timeout,
; sin importar lo que diga max_execution_time ni set_time_limit(0) en el
; código. Si ese límite se dispara, el worker muere, nginx recibe la
; conexión cerrada y el navegador muestra "502" o "504", con la
; transacción del import a medias.
;
; Se copia a: /usr/local/etc/php-fpm.d/zz-import.conf
; (el prefijo zz- garantiza que se cargue después de www.conf y gane)
; ---------------------------------------------------------------------------

[www]

; 0 = sin límite. La cota real del import la ponen el fastcgi_read_timeout
; de nginx (7200s en la ruta de AdminPanel.php) y la propia transacción.
request_terminate_timeout = 0

; Registrar en el log los requests que superen este tiempo, con su stack
; trace. No los corta: sólo deja rastro para diagnosticar dónde se traba.
request_slowlog_timeout = 60s
slowlog = /proc/self/fd/2

; El import es de un solo usuario a la vez y consume memoria; no hace falta
; una granja de workers, pero sí que existan suficientes para que el panel
; siga respondiendo mientras corre la carga.
pm = dynamic
pm.max_children = 50
pm.start_servers = 5
pm.min_spare_servers = 5
pm.max_spare_servers = 20

; Reciclar workers evita que la memoria de un import grande quede retenida.
pm.max_requests = 500

; Que los errores de PHP salgan al log del contenedor (docker compose logs).
catch_workers_output = yes
decorate_workers_output = no