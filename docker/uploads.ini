; Límites de subida de archivos -- el default de PHP (2-8M) es insuficiente
; para el import de CSV de académico (se vieron archivos de ~97MB).
; client_max_body_size en nginx.conf debe ser >= a estos valores, si no
; nginx corta la request antes de que llegue acá.
upload_max_filesize = 128M
post_max_size       = 128M

; El import de 97MB procesa el archivo en streaming (no lo carga en RAM),
; pero PHP-FPM, Doctrine y los batches de INSERT consumen memoria adicional.
; 256M es suficiente; 512M da margen si el archivo crece o el servidor tiene
; picos de registros muy grandes.
memory_limit = 512M

; Un import de 97MB puede tardar -- CsvService::importCSV() ya hace su
; propio set_time_limit(0) en el código, pero esto cubre el resto del
; request (lectura del body de la subida, etc.) por las dudas.
max_execution_time = 300
max_input_time     = 300