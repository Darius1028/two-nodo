; Límites de subida de archivos -- el default de PHP (2-8M) es insuficiente
; para el import de CSV de académico (se vieron archivos de ~97MB).
; client_max_body_size en nginx.conf debe ser >= a estos valores, si no
; nginx corta la request antes de que llegue acá.
upload_max_filesize = 128M
post_max_size       = 128M

; El import de 97MB procesa el archivo en streaming (no lo carga en RAM),
; pero PHP-FPM, Doctrine y los batches de INSERT consumen memoria adicional.
; 256M es suficiente; 512M da margen si el archivo crece o el servidor tiene
; picos de registros muy grandes.
; Un import de 200k+ registros puede tardar bastante. CsvService::importCSV()
; ya hace su propio set_time_limit(0), pero max_input_time cubre la lectura
; del cuerpo de la subida, que ocurre ANTES de que corra una sola línea de
; código PHP -- si se agota ahí, el import ni siquiera empieza.
; 0 = sin límite (PHP-FPM sigue acotado por request_terminate_timeout).
max_execution_time = 0
max_input_time     = -1

; El import mantiene en memoria los lotes de INSERT y las filas devueltas por
; OUTPUT INSERTED.* para la auditoría. Con 200k+ registros conviene margen.
memory_limit = 1024M