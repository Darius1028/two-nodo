# ==========================================================================
# Red administrativa: lista de IPs / CIDRs con permiso para operaciones
# sensibles (panel de administración, importación CSV, escrituras admin
# vía API).
#
# ➜ EDITAR ESTA LISTA con los rangos reales de la red administrativa
#   institucional antes de subir a producción. `default 0` = denegado.
#
# Este bloque `geo` debe estar en contexto http; nginx incluye este
# archivo desde /etc/nginx/conf.d/*.conf, por lo que aquí se resuelve
# correctamente.
# ==========================================================================
geo $admin_ip_allowed {
    default 0;

    # === TODO: reemplazar por los rangos institucionales reales ===
    # 10.20.30.0/24   1;   # Ejemplo: subred administrativa principal
    # 192.168.100.5   1;   # Ejemplo: estación autorizada específica

    # Redes internas — útiles en desarrollo/staging.
    # Comentar en producción si NO se quieren tratar como red admin.
    10.0.0.0/8       1;
    172.16.0.0/12    1;
    192.168.0.0/16   1;
}

server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 128M;

    # Subida de archivos grandes: tiempo para recibir el cuerpo de la request.
    # Un CSV de ~100MB por una red lenta puede tardar más que el default (60s).
    client_body_timeout   600s;
    send_timeout          600s;

    # ✅ NUEVO: Configurar el módulo realip para leer la IP real del cliente
    # desde el header X-Forwarded-For que envía el proxy inverso corporativo.
    # Ajusta las IPs/rangos según tu infraestructura (proxy, load balancer, WAF).
    set_real_ip_from 10.0.0.0/8;        # Red interna corporativa
    set_real_ip_from 172.16.0.0/12;     # Red privada
    set_real_ip_from 192.168.0.0/16;    # Red privada
    set_real_ip_from 172.19.0.0/16;     # Red Docker
    real_ip_header X-Forwarded-For;     # Lee la IP real desde este header
    real_ip_recursive on;               # Recursivo para múltiples proxies

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" always;

    location ~ /api\.php {
        # ------------------------------------------------------------------
        # Bloqueo por red administrativa para acciones sensibles.
        # La lista debe mantenerse sincronizada con el switch de
        # public/api.php. Se detecta por query string (?action=...); si en
        # el futuro alguna acción sensible llega solo por body, restringirla
        # a nivel aplicación o crear una location dedicada.
        # ------------------------------------------------------------------
        set $sensitive_api 0;
        if ($arg_action ~ "^(import_csv|save_schema|insert_record|update_record|delete_record|archive_pdf)$") {
            set $sensitive_api 1;
        }
        set $admin_check "$sensitive_api:$admin_ip_allowed";
        if ($admin_check = "1:0") {
            return 403;
        }

        fastcgi_pass php-app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_intercept_errors on;
        fastcgi_param REMOTE_ADDR          $remote_addr;
        fastcgi_param HTTP_X_REAL_IP       $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
        include fastcgi_params;
        fastcgi_read_timeout 120s;
        fastcgi_send_timeout 120s;
    }

    # ✅ AGREGAR ESTO: Configurar página de error 404
        error_page 404 /404.html;
        error_page 403 /403.html;

        location = /404.html {
            root /var/www/html/public;
            internal;
        }

        location = /403.html {
            root /var/www/html/public;
            internal;
        }

        # Agregar monitoring
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

    # Logs
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # Permite acceder con el prefijo /sistema-record-academico/public/
    rewrite ^/sistema-record-academico/public/(.*)$ /$1 last;

    # Assets estáticos
    location ~* \.(png|jpg|jpeg|gif|ico|css|js|svg|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # PHP
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ------------------------------------------------------------------
    # Importación masiva de CSV (200k+ registros).
    # El proceso corre dentro de un único request y puede tardar bastante;
    # con el fastcgi_read_timeout general (300s) nginx cortaba con
    # "504 Gateway Time-out" aunque PHP siguiera trabajando.
    # Se le da una ventana amplia sólo a esta ruta, no a todo el sitio.
    # ------------------------------------------------------------------
    location = /AdminPanel.php {
        # ------------------------------------------------------------------
        # El panel de administración concentra todas las acciones de
        # escritura sensibles (import_csv, save_schema, delete_year_db,
        # insert/update/delete_record, upload_asset, toggle_qr). Restringir
        # la ruta entera por IP es más simple y seguro que filtrar por
        # cada action del POST body (nginx no puede leer el body sin
        # complicaciones).
        # ------------------------------------------------------------------
        if ($admin_ip_allowed = 0) {
            return 403;
        }

        fastcgi_pass php-app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        fastcgi_intercept_errors on;
        fastcgi_param REMOTE_ADDR          $remote_addr;
        fastcgi_param HTTP_X_REAL_IP       $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;

        include fastcgi_params;

        # 2 horas: cubre importaciones muy grandes.
        fastcgi_read_timeout    7200s;
        fastcgi_send_timeout    7200s;
        fastcgi_connect_timeout 60s;

        # Sin buffering: nginx no espera a tener toda la respuesta en disco.
        fastcgi_buffering off;
        fastcgi_request_buffering off;
    }

    location ~ \.php$ {
            fastcgi_pass php-app:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

            # ✅ AGREGAR ESTA LÍNEA: Permite a Nginx interceptar los errores 404/403 de PHP-FPM
            # y mostrar las páginas personalizadas definidas en error_page.
            fastcgi_intercept_errors on;

            # ✅ AHORA $remote_addr contiene la IP REAL del cliente (gracias a realip)
            fastcgi_param REMOTE_ADDR      $remote_addr;
            fastcgi_param HTTP_X_REAL_IP   $remote_addr;

            # ✅ Pasar también X-Forwarded-For para que RequestContext lo lea
            fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;

            include fastcgi_params;
            fastcgi_read_timeout 300;
            fastcgi_send_timeout 300;
        }

    # Bloquear acceso a archivos sensibles
    location ~ /\. {
        deny all;
    }
    location ~* \.(env|json|lock|md)$ {
        deny all;
    }
    location ~* ^/(config|database|var)/ {
        deny all;
    }
    location ~* ^/(PruebaImagen|diagnostico)\.php$ {
        deny all;
    }
    location ~* /var/ {
        deny all;
    }
}