server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 128M;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # Permite acceder con el prefijo /sistema-record-academico/public/
    # (la ruta ya dada de alta en Keycloak como redirect_uri) sin duplicar
    # rutas contra el docroot real. Se reescribe internamente hacia la raíz
    # ANTES de que nginx decida qué location usar (por eso el "last"), así
    # que también sigue funcionando sin el prefijo (http://localhost/...).
    rewrite ^/sistema-record-academico/public/(.*)$ /$1 last;

    # Assets estáticos
    location ~* \.(png|jpg|jpeg|gif|ico|css|js|svg|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # PHP
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php-app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # Bloquear acceso a archivos sensibles
    location ~ /\. {
        deny all;
    }
    location ~* \.(env|json|lock|md)$ {
        deny all;
    }
}