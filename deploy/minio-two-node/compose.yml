name: academic-minio

services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: academic_minio_distributed
    hostname: ${MINIO_NODE_NAME:?set MINIO_NODE_NAME to app-record-01 or app-record-02}
    network_mode: host
    command:
      - server
      - --address
      - ":9000"
      - --console-address
      - "${MINIO_CONSOLE_ADDRESS:-127.0.0.1:9001}"
      - "${MINIO_CLUSTER_SCHEME:-https}://app-record-{01...02}:9000/data{1...4}"
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
      MINIO_STORAGE_CLASS_STANDARD: EC:4
    volumes:
      # Cada origen debe ser el punto de montaje de un disco/volumen distinto.
      - type: bind
        source: ${MINIO_DISK_1:?set MINIO_DISK_1}
        target: /data1
      - type: bind
        source: ${MINIO_DISK_2:?set MINIO_DISK_2}
        target: /data2
      - type: bind
        source: ${MINIO_DISK_3:?set MINIO_DISK_3}
        target: /data3
      - type: bind
        source: ${MINIO_DISK_4:?set MINIO_DISK_4}
        target: /data4
      - type: bind
        source: ${MINIO_CERTS_DIR:?set MINIO_CERTS_DIR}
        target: /root/.minio/certs
        read_only: true
    secrets:
      - minio_root_user
      - minio_root_password
    healthcheck:
      # Liveness no debe reiniciar un nodo sólo porque el clúster perdió quorum.
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --show-error --insecure
          "${MINIO_CLUSTER_SCHEME:-https}://127.0.0.1:9000/minio/health/live"
          >/dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 2m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

secrets:
  minio_root_user:
    file: ${MINIO_ROOT_USER_FILE:?set MINIO_ROOT_USER_FILE}
  minio_root_password:
    file: ${MINIO_ROOT_PASSWORD_FILE:?set MINIO_ROOT_PASSWORD_FILE}
